# Package as a single runnable uber-jar (project deploy convention).
quarkus.package.jar.type=uber-jar
quarkus.package.jar.add-runner-suffix=false

# Broker HTTP front. Sits in front of the AiServiceEndpoints (vLLM, YomiToku, Marker, embedding).
quarkus.http.port=8085

# Physical compute nodes to probe (comma-separated, no scheme/port — JobQueueRegistry
# appends each EndpointKind's conventional port). Each entry is either a plain IP or a
# CIDR block (expanded to every address in it, up to /24). Empty by default; set per environment.
# broker.nodes=192.168.5.16,192.168.5.17
# broker.nodes=192.168.5.0/26

# Integration test (@QuarkusTest) points at in-JVM stub AiServiceEndpoints, not real nodes.
%test.broker.nodes=127.0.0.1

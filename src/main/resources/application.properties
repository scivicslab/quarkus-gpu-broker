# Package as a single runnable uber-jar (project deploy convention).
quarkus.package.jar.type=uber-jar
quarkus.package.jar.add-runner-suffix=false

# Broker HTTP front. Sits in front of the AiServiceEndpoints (vLLM, YomiToku, Marker, embedding).
quarkus.http.port=8085

# Management authentication (ManagementAuthentication_261115_oo01). Only the management endpoints
# (PUT /capacity/{address}) need a bearer token from the Keycloak realm w206-infra; every other
# endpoint is open. proactive=false is what keeps the rest open: an Authorization header that
# reaches an open endpoint (an OpenAI SDK sends "Bearer <anything>") is not looked at, because
# authentication runs only when a protected method is called.
#
# Discovery is off and the signing keys are read from jwks-path the first time a token has to be
# checked, so the broker starts and serves without Keycloak; a management call made while Keycloak
# cannot be reached is refused (401). The issuer is what Keycloak puts in "iss": its public address,
# which differs from auth-server-url (the Service inside the cluster).
quarkus.http.auth.proactive=false
quarkus.oidc.devservices.enabled=false
quarkus.oidc.application-type=service
quarkus.oidc.client-id=gpu-broker
quarkus.oidc.auth-server-url=${BROKER_OIDC_URL:http://keycloak.keycloak-with-audit.svc:8080/pups-with-audit-auth/realms/w206-infra}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.token.issuer=${BROKER_OIDC_ISSUER:https://192.168.5.25/pups-with-audit-auth/realms/w206-infra}
quarkus.oidc.token.forced-jwk-refresh-interval=30S
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.connection-timeout=5S

# broker.* configuration (nodes, per-endpoint capability overrides) moved to
# application.yaml — see BrokerConfig and CapabilityConfig_260810_oo01.

# Package as a single runnable uber-jar (project deploy convention).
quarkus.package.jar.type=uber-jar
quarkus.package.jar.add-runner-suffix=false

# Broker HTTP front (OpenAI-compatible). Sits in front of the standalone vLLM nodes.
quarkus.http.port=8085

# Upstream vLLM node URLs (comma-separated). Empty by default; set per environment.
# gpu-broker.node-urls=http://192.168.5.16:8000,http://192.168.5.17:8000

# Integration test (@QuarkusTest) points at the in-JVM stub vLLM, not a real node.
%test.gpu-broker.node-urls=http://localhost:28099
